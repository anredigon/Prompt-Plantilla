<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de obra</title>
<style id="estilos-informe">
.viz-root {
  color-scheme: light;
  --surface-0: #eeede8; --surface-1: #ffffff; --border: #d3d2cc; --grid: #e6e5e0;
  --text-primary: #0b0b0b; --text-secondary: #3d3c39; --text-muted: #5c5b56;
  --pv: #2a78d6; --ac: #eb6834; --ev: #1baf7a;
  --plan-bar: #cde2fb; --corte: #52514e;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --neutral: #b4b3ad;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --border: #33332f; --grid: #2a2a27;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a998f;
    --pv: #3987e5; --ac: #d95926; --ev: #199e70; --plan-bar: #184f95; --corte: #c3c2b7; --neutral: #5d5c57;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --surface-0: #111110; --surface-1: #1a1a19; --border: #33332f; --grid: #2a2a27;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a998f;
  --pv: #3987e5; --ac: #d95926; --ev: #199e70; --plan-bar: #184f95; --corte: #c3c2b7; --neutral: #5d5c57;
}
* { box-sizing: border-box; }
body { margin: 0; }
.viz-root { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--surface-0); color: var(--text-primary); min-height: 100vh; padding: 24px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0 0 12px; }
.sub { color: var(--text-secondary); }
.muted { color: var(--text-muted); font-size: 12px; }
.banner { border: 1px dashed var(--serious); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--text-secondary); }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.heads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.head .lab { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); }
.head .big { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.head .det { color: var(--text-secondary); font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.kpi .lab { font-size: 12px; color: var(--text-secondary); }
.kpi .val { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .det { font-size: 12px; color: var(--text-muted); }
.meter { height: 8px; background: var(--grid); border-radius: 4px; position: relative; margin-top: 8px; overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.status .ic { width: 16px; height: 16px; display: inline-grid; place-items: center; border-radius: 50%; color: #fff; font-size: 10px; line-height: 1; }
.grid2 { display: grid; grid-template-columns: 1.45fr 1fr; gap: 16px; }
.alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.alerts li { display: grid; grid-template-columns: 118px 1fr; gap: 10px; align-items: start; padding-bottom: 10px; border-bottom: 1px solid var(--grid); }
.alerts li:last-child { border-bottom: 0; padding-bottom: 0; }
.alerts .tipo { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; display: block; margin-top: 2px; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
svg text { font-family: inherit; }
.tt { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); opacity: 0; transition: opacity .08s; z-index: 10; min-width: 180px; }
.tt b { display: block; margin-bottom: 4px; }
.tt .r { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; }
.tt .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); font-size: 13px; vertical-align: middle; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary); font-weight: 600; }
td.n, th.n { text-align: right; }
.gantt-cell { width: 36%; min-width: 260px; }
details summary { cursor: pointer; color: var(--text-secondary); font-size: 12px; margin-top: 8px; }
.toolbar { display: flex; gap: 8px; align-items: center; }
button.theme { background: var(--surface-1); color: var(--text-secondary); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
footer { font-size: 12px; color: var(--text-muted); }
@media (max-width: 980px) { .heads, .grid2, .cols2 { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } }
@media print { .viz-root { background: #fff; padding: 0; } .toolbar { display: none; } .card { break-inside: avoid; } }
</style>
<style>
/* VOICE: herramienta de trabajo de un director de proyecto; sobria, legible, sin adornos.
   IDEA: el cuaderno de control semanal de obra: pasos numerados, tablas que se corrigen a mano.
   PICTURE: el propio informe de valor ganado (curva S y semáforos) es la imagen principal.
   COLOUR and TYPE: los del informe (tinta casi negra sobre papel claro, azul de planificado como acento).
   LAYOUT: una columna de 1240 px; pasos arriba, contenido en tarjetas, navegación abajo. */
body { margin: 0; }
.viz-root { min-height: 100vh; }
.marco { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }
.barra-app { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); }
.barra-app b { color: var(--text-primary); font-size: 15px; }
#rol { border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }
#vista { display: grid; gap: 16px; }
.cabecera-vista { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.cabecera-vista h1 { font-size: clamp(22px, 3vw, 30px); margin: 2px 0 0; text-wrap: balance; }
.cabecera-vista p { margin: 0; }
h2 { font-size: 16px; } h3 { font-size: 14px; margin: 18px 0 8px; }
button, .boton { font: inherit; font-size: 14px; min-height: 40px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .boton:hover { border-color: var(--text-muted); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--pv); outline-offset: 1px; }
button.primario { background: var(--pv); border-color: var(--pv); color: #fff; font-weight: 600; }
button:disabled { opacity: .55; cursor: wait; }
button.link { border: 0; background: none; color: var(--pv); padding: 4px; min-height: 0; }
.botones { display: flex; gap: 8px; flex-wrap: wrap; }
input, select, textarea { font: inherit; font-size: 15px; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; }
textarea { width: 100%; resize: vertical; }
.form { display: grid; gap: 14px; max-width: 560px; }
.form label, label.control { display: grid; gap: 4px; font-weight: 600; font-size: 14px; }
.form label .muted, label.control .muted { font-weight: 400; }
label.control { max-width: 420px; margin-top: 12px; }
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.tarjeta { display: grid; gap: 6px; text-align: left; align-content: start; min-height: 130px; }
.tarjeta b { font-size: 16px; }
.vacio { text-align: center; padding: 40px 16px; }
.pasos-barra { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; counter-reset: p; }
.pasos-barra li { counter-increment: p; font-size: 13px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); background: var(--surface-1); }
.pasos-barra li::before { content: counter(p) " · "; }
.pasos-barra li.actual { border-color: var(--pv); color: var(--text-primary); font-weight: 600; }
.pasos-barra li.hecho { color: var(--text-muted); }
.cuerpo-paso p { max-width: 75ch; }
.navegacion { display: flex; justify-content: space-between; gap: 8px; }
.zona-ia { display: grid; gap: 8px; margin: 8px 0 16px; }
.drop { border: 2px dashed var(--border); border-radius: 10px; padding: 18px; display: grid; gap: 4px; text-align: center; cursor: pointer; background: var(--surface-0); }
.drop:hover, .drop.sobre { border-color: var(--pv); }
.lista-adj { font-size: 13px; color: var(--text-primary); }
.acciones-ia { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.estado-ia { font-size: 13px; color: var(--text-secondary); }
table.editable input, table.editable select { font-size: 14px; padding: 5px 6px; width: 100%; min-width: 60px; }
table.editable td { padding: 4px; }
.leyenda-fuentes { margin: 0 0 12px; padding-left: 18px; color: var(--text-secondary); font-size: 14px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; }
.tabs button.activa { border-bottom-color: var(--pv); font-weight: 600; }
.barra-informe { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.barra-informe input { width: 72px; }
.lista-export { display: grid; gap: 14px; }
.lista-export > div { display: grid; gap: 4px; justify-items: start; padding-bottom: 14px; border-bottom: 1px solid var(--grid); }
.manuales, .pagos { display: grid; gap: 8px; }
.manuales label { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.manuales input { width: 80px; text-align: right; }
.pct { white-space: nowrap; }
.fila-extra { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 6px 0; }
.ok-box { border-left: 3px solid var(--good); padding: 8px 12px; margin-top: 8px; background: var(--surface-0); }
.resumen-final { display: grid; gap: 8px; margin-bottom: 12px; }
.resumen-final > div { display: grid; gap: 2px; }
.aviso { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: min(680px, 92vw); padding: 10px 16px; border-radius: 8px; background: var(--text-primary); color: var(--surface-1); font-size: 14px; z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.aviso.error { background: var(--critical); color: #fff; } .aviso.warn { background: var(--warning); color: #0b0b0b; }
.error { border: 1px solid var(--critical); border-radius: 8px; padding: 10px 14px; }
.scroll { overflow-x: auto; }
#app.wrap { max-width: none; }
@media (max-width: 600px) { .viz-root { padding: 12px; } .navegacion button { flex: 1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="viz-root">
  <div class="marco">
    <div class="barra-app"><b>Control de obra · valor ganado</b><span id="rol">Conectando…</span></div>
    <main id="vista"><div class="card"><p class="muted">Cargando proyectos…</p></div></main>
  </div>
  <div class="tt" id="tt" role="tooltip"></div>
  <div class="aviso" id="aviso" hidden role="status"></div>
  <input type="file" id="importar" accept=".xlsx,.xlsm" hidden>
</div>
<script src="./xlsx.full.min.js"></script>
<script src="./pdf.min.js"></script>
<script src="./motor.js"></script>
<script src="./informe.js"></script>
<script src="./app.js"></script>
</body>
</html>
